<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>گزارش بازدید — سیلانه سبز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #0b2218;
  --pine:   #153d2a;
  --sage:   #2a6e4a;
  --mint:   #4aad7a;
  --foam:   #a8e6c4;
  --cream:  #f0faf5;
  --gold:   #d4a84b;
  --gold2:  #f2cc7a;
  --red:    #c0392b;
  --amber:  #e07b2a;
  --white:  #ffffff;
  --card:   rgba(255,255,255,0.97);
  --border: rgba(42,110,74,0.15);
  --shadow: 0 20px 60px rgba(11,34,24,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;height:100%}
body{
  font-family:'Vazirmatn',sans-serif;
  min-height:100vh;
  background: var(--forest);
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 10%, rgba(74,173,122,.22) 0%,transparent 60%),
    radial-gradient(ellipse 50% 70% at 85% 85%, rgba(42,110,74,.3) 0%,transparent 55%),
    radial-gradient(ellipse 40% 40% at 60% 40%, rgba(212,168,75,.08) 0%,transparent 60%);
}

/* ─── HEADER ─── */
.topbar{
  position:relative;z-index:10;
  padding:20px 20px 0;
  display:flex;align-items:center;gap:14px;
}
.logo-mark{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--mint),var(--sage));
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
  box-shadow:0 4px 20px rgba(74,173,122,.4);
}
.brand h1{font-size:1.2rem;font-weight:800;color:var(--white);line-height:1.2}
.brand p{font-size:.75rem;color:var(--foam);opacity:.8;margin-top:2px}

/* ─── STEPS ─── */
.steps{
  position:relative;z-index:10;
  display:flex;justify-content:center;align-items:center;gap:0;
  padding:18px 20px 0;
}
.step{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  flex:1;
}
.step-dot{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;
  background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.4);
  border:2px solid rgba(255,255,255,.15);
  transition:all .3s ease;
}
.step.active .step-dot{background:var(--mint);color:var(--forest);border-color:var(--mint);box-shadow:0 0 16px rgba(74,173,122,.5)}
.step.done .step-dot{background:var(--sage);color:var(--white);border-color:var(--sage)}
.step-line{flex:1;height:2px;background:rgba(255,255,255,.1);margin-bottom:14px;max-width:40px}
.step.done~.step-line{background:var(--sage)}
.step-label{font-size:.62rem;color:rgba(255,255,255,.4);white-space:nowrap}
.step.active .step-label{color:var(--foam)}
.step.done .step-label{color:var(--mint)}

/* ─── CARD ─── */
.card-wrap{
  position:relative;z-index:10;
  padding:16px;
  max-width:520px;margin:0 auto;
}
.card{
  background:var(--card);
  border-radius:24px;
  padding:24px 20px 28px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.6);
}
.card-title{
  font-size:1.05rem;font-weight:800;color:var(--pine);
  margin-bottom:4px;
}
.card-sub{font-size:.78rem;color:var(--sage);margin-bottom:20px}

/* ─── FIELDS ─── */
label{display:block;font-size:.78rem;font-weight:700;color:var(--pine);margin-bottom:6px}
select,input[type=text],input[type=number],textarea{
  width:100%;
  padding:12px 14px;
  border:2px solid var(--border);
  border-radius:12px;
  font-family:'Vazirmatn',sans-serif;
  font-size:.88rem;
  color:var(--pine);
  background:var(--cream);
  outline:none;
  transition:border .2s,box-shadow .2s;
  appearance:none;
  -webkit-appearance:none;
}
select:focus,input:focus,textarea:focus{
  border-color:var(--mint);
  box-shadow:0 0 0 3px rgba(74,173,122,.15);
}
textarea{resize:vertical;min-height:80px}
.field{margin-bottom:16px}

/* info box */
.info-box{
  display:none;
  background:linear-gradient(135deg,#e8f8f0,#d5f5e3);
  border:1.5px solid rgba(42,110,74,.25);
  border-radius:12px;
  padding:10px 14px;
  margin-bottom:16px;
  font-size:.78rem;
  color:var(--pine);
}
.info-box.show{display:block}
.info-row{display:flex;justify-content:space-between;padding:2px 0}
.info-row span:first-child{font-weight:700}

/* customer count */
.cust-badge{
  display:none;
  font-size:.72rem;color:var(--sage);
  margin-top:4px;margin-bottom:12px;
  padding:4px 10px;
  background:rgba(74,173,122,.1);
  border-radius:8px;
  width:fit-content;
}
.cust-badge.show{display:block}

/* ─── RADIO RESULT ─── */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.result-card{
  position:relative;
  border:2px solid var(--border);
  border-radius:14px;
  padding:12px 10px;
  text-align:center;
  cursor:pointer;
  transition:all .2s;
  background:var(--cream);
}
.result-card input{display:none}
.result-card .icon{font-size:1.5rem;display:block;margin-bottom:4px}
.result-card .lbl{font-size:.75rem;font-weight:700;color:var(--pine)}
.result-card.yes:has(input:checked){background:#e8f8f0;border-color:var(--mint);box-shadow:0 0 0 3px rgba(74,173,122,.15)}
.result-card.no:has(input:checked){background:#fef0f0;border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.15)}
.result-card.follow:has(input:checked){background:#fef8e8;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,168,75,.15)}
.result-card.noaxx:has(input:checked){background:#f5f0ff;border-color:#8e44ad;box-shadow:0 0 0 3px rgba(142,68,173,.15)}

/* conditional fields */
.cond-field{display:none;margin-bottom:16px}
.cond-field.show{display:block}

/* reason chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.chip{
  padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;
  font-size:.75rem;font-weight:600;color:var(--pine);
  cursor:pointer;background:var(--cream);transition:all .2s;
  user-select:none;
}
.chip.active{background:var(--pine);color:var(--white);border-color:var(--pine)}
#reason{margin-top:8px;display:none}
#reason.show{display:block}

/* ─── SUBMIT ─── */
.btn-submit{
  width:100%;padding:15px;
  background:linear-gradient(135deg,var(--sage),var(--mint));
  color:var(--white);font-family:'Vazirmatn',sans-serif;
  font-size:.95rem;font-weight:800;
  border:none;border-radius:14px;cursor:pointer;
  box-shadow:0 6px 24px rgba(42,110,74,.4);
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(42,110,74,.5)}
.btn-submit:disabled{opacity:.6;transform:none;cursor:not-allowed}
.spinner{
  width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── SUCCESS ─── */
.success{
  display:none;
  position:relative;z-index:10;
  padding:16px;max-width:520px;margin:0 auto;
}
.success.show{display:block}
.success-card{
  background:var(--card);border-radius:24px;
  padding:40px 24px;text-align:center;
  box-shadow:var(--shadow);
}
.success-icon{font-size:4rem;margin-bottom:16px;display:block}
.success-card h2{font-size:1.3rem;font-weight:800;color:var(--pine);margin-bottom:8px}
.success-card p{font-size:.85rem;color:var(--sage);line-height:1.6}
.summary-box{
  background:linear-gradient(135deg,#e8f8f0,#d5f5e3);
  border-radius:14px;padding:14px 16px;margin:16px 0;
  text-align:right;
}
.s-row{display:flex;justify-content:space-between;padding:3px 0;font-size:.8rem}
.s-row .k{color:var(--sage);font-weight:600}
.s-row .v{color:var(--pine);font-weight:700}
.btn-reset{
  margin-top:16px;padding:12px 28px;
  background:transparent;border:2px solid var(--sage);
  color:var(--sage);border-radius:12px;font-family:'Vazirmatn',sans-serif;
  font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;
}
.btn-reset:hover{background:var(--sage);color:var(--white)}

/* daily report */
.report-btn{
  position:fixed;bottom:20px;left:16px;z-index:100;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;cursor:pointer;
  box-shadow:0 4px 20px rgba(212,168,75,.5);
  font-size:1.3rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.report-btn:hover{transform:scale(1.1)}

.report-panel{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(11,34,24,.85);backdrop-filter:blur(8px);
  align-items:flex-end;justify-content:center;
}
.report-panel.open{display:flex}
.report-inner{
  background:var(--white);width:100%;max-width:520px;
  border-radius:24px 24px 0 0;padding:24px;
  max-height:80vh;overflow-y:auto;
}
.report-inner h3{font-size:1rem;font-weight:800;color:var(--pine);margin-bottom:16px}
.report-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:.8rem;
}
.report-row:last-child{border-bottom:none}
.report-row .name{font-weight:700;color:var(--pine)}
.report-row .result{font-weight:700}
.result-yes{color:#27ae60}.result-no{color:var(--red)}.result-follow{color:var(--amber)}.result-noaxx{color:#8e44ad}
.close-report{
  width:100%;padding:12px;margin-top:16px;
  background:var(--pine);color:var(--white);
  border:none;border-radius:12px;font-family:'Vazirmatn',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer;
}
.empty-report{text-align:center;color:var(--sage);padding:24px;font-size:.85rem}

@media(max-width:400px){
  .card{padding:20px 16px 24px}
  .result-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- Header -->
<div class="topbar">
  <div class="logo-mark">🌿</div>
  <div class="brand">
    <h1>سیلانه سبز</h1>
    <p>سیستم ثبت گزارش بازدید</p>
  </div>
</div>

<!-- Steps -->
<div class="steps" id="stepsBar">
  <div class="step active" id="st1"><div class="step-dot">۱</div><div class="step-label">بازاریاب</div></div>
  <div class="step-line"></div>
  <div class="step" id="st2"><div class="step-dot">۲</div><div class="step-label">مشتری</div></div>
  <div class="step-line"></div>
  <div class="step" id="st3"><div class="step-dot">۳</div><div class="step-label">نتیجه</div></div>
</div>

<!-- Main Card -->
<div class="card-wrap" id="mainCard">
  <div class="card">
    <div class="card-title">گزارش بازدید</div>
    <div class="card-sub">لطفاً اطلاعات بازدید را وارد کنید</div>

    <!-- Step 1: بازاریاب -->
    <div class="field">
      <label>👤 نام بازاریاب</label>
      <select id="sp" onchange="onSPChange()">
        <option value="" disabled selected>انتخاب کنید...</option>
        <option value="آتنا مشهدلو">آتنا مشهدلو</option>
<option value="آرش صادق زاده زنوزی">آرش صادق زاده زنوزی</option>
<option value="ابراهیم اکبرنواز قوشچی">ابراهیم اکبرنواز قوشچی</option>
<option value="امیرحسین بابائی دوچقائی">امیرحسین بابائی دوچقائی</option>
<option value="امیرحسین خان محمدی">امیرحسین خان محمدی</option>
<option value="امیرحسین ملکی">امیرحسین ملکی</option>
<option value="امین اکبری">امین اکبری</option>
<option value="ایمان محمدی">ایمان محمدی</option>
<option value="بهنام رضایی">بهنام رضایی</option>
<option value="جواد حسینی">جواد حسینی</option>
<option value="حامد موسوی">حامد موسوی</option>
<option value="حسن رضایی">حسن رضایی</option>
<option value="حسین احمدی">حسین احمدی</option>
<option value="حمید رضا نجفی">حمید رضا نجفی</option>
<option value="داود کریمی">داود کریمی</option>
<option value="رضا توکلی صائب">رضا توکلی صائب</option>
<option value="رضا علیزاده">رضا علیزاده</option>
<option value="زهرا حسینی">زهرا حسینی</option>
<option value="سارا محمدی">سارا محمدی</option>
<option value="سعید رضایی">سعید رضایی</option>
<option value="سعید قسمتی">سعید قسمتی</option>
<option value="سید داود حسینی منفرد">سید داود حسینی منفرد</option>
<option value="شهرام کریمی">شهرام کریمی</option>
<option value="صادق موسوی">صادق موسوی</option>
<option value="علی احمدی">علی احمدی</option>
<option value="علی رضایی">علی رضایی</option>
<option value="علیرضا کریمی">علیرضا کریمی</option>
<option value="فاطمه حسینی">فاطمه حسینی</option>
<option value="فرهاد محمدی">فرهاد محمدی</option>
<option value="مجید احمدی">مجید احمدی</option>
<option value="مجید واحدی">مجید واحدی</option>
<option value="محمد حسینی">محمد حسینی</option>
<option value="محمد رضایی">محمد رضایی</option>
<option value="محمدرضا احمدی">محمدرضا احمدی</option>
<option value="مرتضی محمدی">مرتضی محمدی</option>
<option value="مسعود کریمی">مسعود کریمی</option>
<option value="مصطفی احمدی">مصطفی احمدی</option>
<option value="مهدی حاجی حسن">مهدی حاجی حسن</option>
<option value="مهدی رضایی">مهدی رضایی</option>
<option value="مهدی محمدی">مهدی محمدی</option>
<option value="میثم کریمی">میثم کریمی</option>
<option value="ناصر احمدی">ناصر احمدی</option>
<option value="نسرین محمدی">نسرین محمدی</option>
<option value="هادی رضایی">هادی رضایی</option>
<option value="هادی کریمی">هادی کریمی</option>
<option value="پریسا کریمی">پریسا کریمی</option>
<option value="کاظم رضایی">کاظم رضایی</option>
<option value="کاوه بلوچی">کاوه بلوچی</option>
<option value="یاسر احمدی">یاسر احمدی</option>
<option value="یوسف محمدی">یوسف محمدی</option>
      </select>
    </div>

    <!-- Info box -->
    <div class="info-box" id="infoBox">
      <div class="info-row"><span>مدیر:</span><span id="mgr">—</span></div>
      <div class="info-row"><span>سرپرست:</span><span id="sup">—</span></div>
    </div>

    <!-- Step 2: مشتری -->
    <div class="field">
      <label>🏪 فروشگاه مورد بازدید</label>
      <select id="customer" disabled onchange="onCustomerChange()">
        <option value="" disabled selected>ابتدا بازاریاب را انتخاب کنید</option>
      </select>
      <div class="cust-badge" id="custBadge"></div>
    </div>

    <!-- Step 3: نتیجه -->
    <label>📋 نتیجه بازدید</label>
    <div class="result-grid">
      <label class="result-card yes">
        <input type="radio" name="result" value="خرید کرد" onchange="onResult()">
        <span class="icon">✅</span><span class="lbl">خرید کرد</span>
      </label>
      <label class="result-card no">
        <input type="radio" name="result" value="خرید نکرد" onchange="onResult()">
        <span class="icon">❌</span><span class="lbl">خرید نکرد</span>
      </label>
      <label class="result-card follow">
        <input type="radio" name="result" value="نیاز به پیگیری" onchange="onResult()">
        <span class="icon">🔄</span><span class="lbl">نیاز به پیگیری</span>
      </label>
      <label class="result-card noaxx">
        <input type="radio" name="result" value="دسترسی نداشتم" onchange="onResult()">
        <span class="icon">🚫</span><span class="lbl">دسترسی نداشتم</span>
      </label>
    </div>

    <!-- مبلغ (فقط خرید کرد) -->
    <div class="cond-field" id="amountWrap">
      <label>💰 مبلغ خرید (تومان)</label>
      <input type="number" id="amount" placeholder="مثال: 5000000">
    </div>

    <!-- علت (فقط خرید نکرد) -->
    <div class="cond-field" id="reasonWrap">
      <label>❓ علت عدم خرید</label>
      <div class="chips">
        <div class="chip" onclick="selectChip(this, 'موجودی داره')">موجودی داره</div>
        <div class="chip" onclick="selectChip(this, 'قیمت بالاست')">قیمت بالاست</div>
        <div class="chip" onclick="selectChip(this, 'نیاز ندارد')">نیاز ندارد</div>
        <div class="chip" onclick="selectChip(this, 'بودجه ندارد')">بودجه ندارد</div>
        <div class="chip" onclick="selectChip(this, 'رقیب دیگری')">رقیب دیگری</div>
        <div class="chip" onclick="selectChip(this, 'سایر')">سایر...</div>
      </div>
      <input type="text" id="reason" placeholder="توضیح بنویسید...">
    </div>

    <!-- تاریخ پیگیری -->
    <div class="cond-field" id="followupWrap">
      <label>📅 زمان پیگیری بعدی</label>
      <select id="followup">
        <option value="">انتخاب کنید</option>
        <option>فردا</option>
        <option>۳ روز دیگر</option>
        <option>یک هفته دیگر</option>
        <option>دو هفته دیگر</option>
      </select>
    </div>

    <!-- یادداشت -->
    <div class="field">
      <label>📝 یادداشت (اختیاری)</label>
      <textarea id="note" placeholder="هر نکته‌ای که مهم است..."></textarea>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitForm()">
      <div class="spinner" id="spinner"></div>
      <span id="btnTxt">ثبت گزارش ←</span>
    </button>
  </div>
</div>

<!-- Success -->
<div class="success" id="successDiv">
  <div class="success-card">
    <span class="success-icon">🎉</span>
    <h2>گزارش ثبت شد!</h2>
    <p>اطلاعات بازدید شما با موفقیت در سیستم ذخیره شد.</p>
    <div class="summary-box" id="summaryBox"></div>
    <button class="btn-reset" onclick="resetForm()">ثبت گزارش جدید</button>
  </div>
</div>

<!-- Daily Report Button -->
<button class="report-btn" onclick="toggleReport()" title="گزارش امروز">📊</button>

<!-- Daily Report Panel -->
<div class="report-panel" id="reportPanel">
  <div class="report-inner">
    <h3>📊 گزارش بازدیدهای امروز</h3>
    <div id="reportList"></div>
    <button class="close-report" onclick="toggleReport()">بستن</button>
  </div>

// Local storage key for daily visits
const TODAY = new Date().toLocaleDateString('fa-IR');
const STORAGE_KEY = 'silaneh_visits_' + new Date().toISOString().slice(0,10);

function getVisits() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveVisit(v) {
  const visits = getVisits();
  visits.push(v);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(visits));
}

function onSPChange() {
  const sp = document.getElementById('sp').value;
  const info = SP_DATA[sp];
  if (!info) return;

  document.getElementById('mgr').textContent = info['مدیر'];
  document.getElementById('sup').textContent = info['سرپرست'];
  document.getElementById('infoBox').classList.add('show');

  const custSel = document.getElementById('customer');
  custSel.innerHTML = '<option value="" disabled selected>انتخاب فروشگاه...</option>';
  info['مشتریان'].forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    custSel.appendChild(o);
  });
  custSel.disabled = false;

  const badge = document.getElementById('custBadge');
  badge.textContent = info['مشتریان'].length + ' مشتری برای بازدید';
  badge.classList.add('show');

  document.getElementById('st2').classList.add('active');
}

function onCustomerChange() {
  document.getElementById('st3').classList.add('active');
}

function onResult() {
  const val = document.querySelector('input[name=result]:checked')?.value;
  document.getElementById('amountWrap').classList.toggle('show', val === 'خرید کرد');
  document.getElementById('reasonWrap').classList.toggle('show', val === 'خرید نکرد');
  document.getElementById('followupWrap').classList.toggle('show',
    val === 'نیاز به پیگیری' || val === 'دسترسی نداشتم');
}

function selectChip(el, val) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const reasonInput = document.getElementById('reason');
  if (val === 'سایر') {
    reasonInput.classList.add('show');
    reasonInput.value = '';
    reasonInput.focus();
  } else {
    reasonInput.classList.remove('show');
    reasonInput.value = val;
  }
}

async function submitForm() {
  const sp = document.getElementById('sp').value;
  const customer = document.getElementById('customer').value;
  const result = document.querySelector('input[name=result]:checked')?.value;

  if (!sp) { alert('لطفاً نام بازاریاب را انتخاب کنید'); return; }
  if (!customer) { alert('لطفاً فروشگاه را انتخاب کنید'); return; }
  if (!result) { alert('لطفاً نتیجه بازدید را مشخص کنید'); return; }

  const info = SP_DATA[sp];
  const payload = {
    'بازاریاب': sp,
    'مدیر': info['مدیر'],
    'سرپرست': info['سرپرست'],
    'مشتری': customer,
    'نتیجه': result,
    'مبلغ_خرید': result === 'خرید کرد' ? (document.getElementById('amount').value || '—') : '—',
    'علت': result === 'خرید نکرد' ? (document.getElementById('reason').value || '—') : '—',
    'پیگیری': (result === 'نیاز به پیگیری' || result === 'دسترسی نداشتم') ? document.getElementById('followup').value : '—',
    'یادداشت': document.getElementById('note').value || '—',
    'تاریخ': TODAY,
    'ساعت': new Date().toLocaleTimeString('fa-IR')
  };

  const btn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const btnTxt = document.getElementById('btnTxt');
  btn.disabled = true;
  spinner.style.display = 'block';
  btnTxt.textContent = 'در حال ارسال...';

  const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxqqEUycAMHfDFD2llRoIFQp-EXVbvE1LVUZ19m0hpu_Vahyj3n5vSxHPLt6t5P-vjeZw/exec';

  try {
    if (WEBHOOK_URL !== 'https://script.google.com/macros/s/AKfycbxqqEUycAMHfDFD2llRoIFQp-EXVbvE1LVUZ19m0hpu_Vahyj3n5vSxHPLt6t5P-vjeZw/exec') {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
    }

    // همیشه توی localStorage ذخیره کن
    saveVisit(payload);

    document.getElementById('summaryBox').innerHTML = `
      <div class="s-row"><span class="k">بازاریاب</span><span class="v">${payload['بازاریاب']}</span></div>
      <div class="s-row"><span class="k">مشتری</span><span class="v">${payload['مشتری']}</span></div>
      <div class="s-row"><span class="k">نتیجه</span><span class="v">${payload['نتیجه']}</span></div>
      ${payload['مبلغ_خرید'] !== '—' ? `<div class="s-row"><span class="k">مبلغ</span><span class="v">${payload['مبلغ_خرید']} تومان</span></div>` : ''}
      ${payload['علت'] !== '—' ? `<div class="s-row"><span class="k">علت</span><span class="v">${payload['علت']}</span></div>` : ''}
      <div class="s-row"><span class="k">ساعت</span><span class="v">${payload['ساعت']}</span></div>
    `;
    document.getElementById('mainCard').style.display = 'none';
    document.getElementById('stepsBar').style.display = 'none';
    document.getElementById('successDiv').classList.add('show');
  } catch(e) {
    // حتی اگه webhook ارسال نشد، local رو ذخیره کن
    saveVisit(payload);
    document.getElementById('summaryBox').innerHTML = `
      <div class="s-row"><span class="k">بازاریاب</span><span class="v">${payload['بازاریاب']}</span></div>
      <div class="s-row"><span class="k">مشتری</span><span class="v">${payload['مشتری']}</span></div>
      <div class="s-row"><span class="k">نتیجه</span><span class="v">${payload['نتیجه']}</span></div>
      <div class="s-row"><span class="k" style="color:#e07b2a">⚠️ آفلاین ذخیره شد</span><span class="v" style="color:#e07b2a">بعداً sync می‌شه</span></div>
    `;
    document.getElementById('mainCard').style.display = 'none';
    document.getElementById('stepsBar').style.display = 'none';
    document.getElementById('successDiv').classList.add('show');
  }
}

function resetForm() {
  document.getElementById('mainCard').style.display = '';
  document.getElementById('stepsBar').style.display = '';
  document.getElementById('successDiv').classList.remove('show');
  document.getElementById('sp').value = '';
  document.getElementById('infoBox').classList.remove('show');
  document.getElementById('customer').innerHTML = '<option value="" disabled selected>ابتدا بازاریاب را انتخاب کنید</option>';
  document.getElementById('customer').disabled = true;
  document.getElementById('custBadge').classList.remove('show');
  document.querySelectorAll('input[name=result]').forEach(r => r.checked = false);
  ['amountWrap','reasonWrap','followupWrap'].forEach(id => document.getElementById(id).classList.remove('show'));
  document.getElementById('amount').value = '';
  document.getElementById('reason').value = '';
  document.getElementById('followup').value = '';
  document.getElementById('note').value = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('btnTxt').textContent = 'ثبت گزارش ←';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  ['st2','st3'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('st1').classList.add('active');
}

function toggleReport() {
  const panel = document.getElementById('reportPanel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) renderReport();
}

function renderReport() {
  const visits = getVisits();
  const list = document.getElementById('reportList');
  if (!visits.length) {
    list.innerHTML = '<div class="empty-report">📭 هنوز بازدیدی ثبت نشده</div>';
    return;
  }
  const resultClass = {
    'خرید کرد': 'result-yes',
    'خرید نکرد': 'result-no',
    'نیاز به پیگیری': 'result-follow',
    'دسترسی نداشتم': 'result-noaxx'
  };
  list.innerHTML = visits.map(v => `
    <div class="report-row">
      <div>
        <div class="name">${v['مشتری']}</div>
        <div style="font-size:.7rem;color:#888;margin-top:2px">${v['بازاریاب']} · ${v['ساعت']}</div>
      </div>
      <div class="result ${resultClass[v['نتیجه']] || ''}">${v['نتیجه']}</div>
    </div>
  `).join('');
}
